<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <rect width="180" height="180" fill="#111"/>
  <!-- Book body -->
  <rect x="38" y="32" width="104" height="120" rx="0" fill="#F5F4F0" stroke="#111" stroke-width="0"/>
  <!-- Spine -->
  <rect x="38" y="32" width="14" height="120" fill="#DEDDD8"/>
  <!-- Spine lines -->
  <line x1="44" y1="44" x2="44" y2="140" stroke="#BBB9B2" stroke-width="1"/>
  <line x1="48" y1="44" x2="48" y2="140" stroke="#BBB9B2" stroke-width="1"/>
  <!-- Page edges -->
  <line x1="56" y1="148" x2="138" y2="148" stroke="#DEDDD8" stroke-width="1"/>
  <line x1="56" y1="150" x2="138" y2="150" stroke="#DEDDD8" stroke-width="1"/>
  <!-- Title text "E" large -->
  <text x="94" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="64" font-weight="700" fill="#111" text-anchor="middle" dominant-baseline="central">E</text>
  <!-- Bookmark ribbon -->
  <polygon points="118,32 130,32 130,62 124,54 118,62" fill="#C0501F"/>
</svg>
