<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Entry</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entry">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F4F0;--card:#fff;--text:#111;--text2:#444;--text3:#888;
  --border:#DEDDD8;--primary:#2362A8;
  --w1:#C0501F;--w2:#2362A8;--w3:#7E35A0;--w4:#1A7340;
  --bad:#B8352A;--bad-bg:#FFF0EE;--good:#1A6B38;--good-bg:#EEFAF2;
  --warn:#8B6914;--warn-bg:#FFF9E8;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;max-width:430px;margin:0 auto;padding-top:env(safe-area-inset-top);height:100%;overflow:hidden}
.view{flex:1;overflow-y:auto;padding:0 20px 20px;display:none;-webkit-overflow-scrolling:touch}
#v-today{padding-top:12px}
.view.active{display:flex;flex-direction:column}
.view-head{padding:24px 0 16px;flex-shrink:0}
.view-head h1{font-size:26px;font-weight:700;letter-spacing:-0.5px}

/* Top Nav */
#topnav{display:flex;gap:0;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;padding:0 20px}
.tab{position:relative;background:none;border:none;color:var(--text3);font-size:13px;font-weight:500;cursor:pointer;padding:12px 14px 10px;font-family:inherit;letter-spacing:0.2px;transition:color .2s}
.tab.active{color:var(--text);font-weight:600}
.tab.active::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:2px;background:var(--text)}

/* Today Card */
.today-card{background:var(--card);padding:0;margin-bottom:4px;flex:1;overflow-y:auto;min-height:0;position:relative;border:1px solid var(--border)}
.card-q{padding:24px 24px 20px;background:#EDE8DF}
.card-a{padding:16px 24px 24px}
.card-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;color:var(--text3)}
.card-title{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:8px}
.card-brief{font-size:13px;color:var(--text2);line-height:1.5}

/* Word display with diff highlighting */
.word-display{font-size:24px;font-weight:600;line-height:1.4;letter-spacing:-0.3px;margin-bottom:8px}
.word-display .wd{white-space:nowrap}
.word-display .df{font-weight:700}
.word-display .wd-sep{color:#ccc;margin:0 6px;font-weight:300}

/* Confusable word items */
.word-item{padding:16px 0;border-bottom:1px solid var(--border)}
.word-item:last-child{border-bottom:none}
.word-item h3{font-size:17px;font-weight:600;margin-bottom:4px}
.word-def{font-size:13px;color:var(--text2);margin-bottom:4px}
.word-note{font-size:12px;margin-bottom:8px;font-style:italic}
.word-examples{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.word-examples li{font-size:12px;padding:4px 10px;font-weight:500}

/* Trap */
.card-trap{margin-top:16px;padding:12px 16px;background:var(--warn-bg);border:1px solid #EDE0B8;display:flex;gap:10px;align-items:flex-start}
.card-trap svg{flex-shrink:0;width:16px;height:16px;margin-top:1px;stroke:var(--warn);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.card-trap p{font-size:13px;line-height:1.6;color:#6B5520;flex:1}

/* Calque */
.calque-bad{font-size:14px;line-height:1.6;padding:12px 16px;background:var(--bad-bg);color:var(--bad);text-decoration:line-through;text-decoration-color:rgba(184,53,42,0.25)}
.calque-good{font-size:14px;line-height:1.6;padding:12px 16px;background:var(--good-bg);margin-bottom:16px;color:var(--good);font-weight:600}
.calque-explain{font-size:13px;line-height:1.7;color:var(--text2);margin-bottom:8px}
.calque-more{padding-top:12px;border-top:1px solid var(--border)}
.calque-more-item{margin-bottom:12px;padding:12px;background:#FAFAF7}
.calque-more-item .zh{font-size:13px;color:var(--text);margin-bottom:4px}
.calque-more-item .bad{font-size:12px;color:var(--bad);text-decoration:line-through;text-decoration-color:rgba(184,53,42,0.25)}
.calque-more-item .good{font-size:12px;color:var(--good);font-weight:600}

/* Register */
.reg-arrow{font-size:24px;font-weight:300;color:var(--text3);margin:6px 0;text-align:center}
.reg-formal{font-size:22px;text-align:center;color:var(--text3);text-decoration:line-through;text-decoration-color:rgba(0,0,0,0.15)}
.reg-natural{font-size:26px;text-align:center;font-weight:700;color:var(--primary);margin-bottom:16px}
.reg-explain{font-size:13px;line-height:1.8;color:var(--text2);margin-bottom:16px}
.reg-example{padding:14px 16px;margin-bottom:8px;font-size:14px;line-height:1.6}
.reg-example.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through;text-decoration-color:rgba(184,53,42,0.25)}
.reg-example.good{background:var(--good-bg);color:var(--good);font-weight:600}
.reg-when{margin-top:12px;padding:12px 16px;background:#F5F4F0;font-size:12px;color:var(--text2);line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.reg-when svg{flex-shrink:0;width:14px;height:14px;margin-top:2px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round}
.reg-when p{flex:1}

/* Card nav */
.card-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;flex-shrink:0}
.card-nav-btn{width:40px;height:40px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .1s}
.card-nav-btn:active{background:var(--border);transform:scale(0.95)}
.card-nav-btn.disabled{opacity:0.25;pointer-events:none}
.card-nav-btn svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round}
.card-dots{display:flex;gap:6px;align-items:center}
.card-dot{width:6px;height:6px;background:var(--border);transition:all .2s}
.card-dot.active{background:var(--text);width:18px}
.card-save{position:absolute;top:20px;right:20px;width:36px;height:36px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.card-save:active{transform:scale(1.2)}
.card-save svg{width:20px;height:20px;stroke:var(--text3);fill:none;stroke-width:2;transition:all .2s}
.card-save.saved svg{fill:#C0501F;stroke:#C0501F}

/* Search */
.search-wrap{padding:20px 0 12px;flex-shrink:0}
.search-box{display:flex;align-items:center;gap:10px;background:var(--card);padding:0 16px;border:1px solid var(--border)}
.search-box svg{width:18px;height:18px;stroke:var(--text3);fill:none;stroke-width:2;flex-shrink:0}
.search-box input{flex:1;border:none;outline:none;background:none;font-size:15px;padding:14px 0;color:var(--text);font-family:inherit}
.search-box input::placeholder{color:var(--text3)}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-shrink:0;overflow-x:auto;padding-bottom:4px}
.chip{padding:6px 14px;border:1px solid var(--border);background:var(--card);font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.search-results{flex:1;overflow-y:auto;min-height:0}
.result-card{background:var(--card);padding:16px;margin-bottom:8px;cursor:pointer;border:1px solid var(--border);transition:transform .1s}
.result-card:active{transform:scale(0.98)}
.result-title{font-size:15px;font-weight:600;margin-bottom:4px}
.result-brief{font-size:12px;color:var(--text2)}
.result-tag{font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.search-empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;line-height:1.8}
.search-hint{text-align:center;padding:80px 20px;color:var(--text3);font-size:14px}

/* Library */
.library-list{flex:1;overflow-y:auto;min-height:0}
.lib-card{background:var(--card);padding:16px;margin-bottom:8px;display:flex;align-items:center;border:1px solid var(--border);cursor:pointer;transition:transform .1s}
.lib-card:active{transform:scale(0.98)}
.lib-card-body{flex:1}
.lib-card-title{font-size:15px;font-weight:600;margin-bottom:3px}
.lib-card-brief{font-size:12px;color:var(--text2)}
.lib-remove{width:32px;height:32px;border:none;background:transparent;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.empty-state{text-align:center;padding:80px 20px;color:var(--text3);font-size:14px;line-height:2}

/* Settings */
.settings-section{padding:20px 0;border-bottom:1px solid var(--border)}
.settings-section:last-child{border-bottom:none}
.settings-section label{font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:8px}
.settings-section input[type="password"]{width:100%;padding:12px 14px;border:1px solid var(--border);font-size:14px;font-family:inherit;outline:none;background:var(--card);color:var(--text);transition:border-color .2s}
.settings-section input:focus{border-color:var(--primary)}
.hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}
.settings-section button{width:100%;padding:12px;border:1px solid var(--bad);background:none;color:var(--bad);font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s}
.settings-section button:active{background:var(--bad-bg)}
.about{text-align:center;color:var(--text3);font-size:13px;line-height:1.8;border-bottom:none}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:rgba(0,0,0,0);transition:background .3s}
.modal.open{display:flex;background:rgba(0,0,0,0.3)}
.modal-sheet{margin-top:auto;background:var(--card);max-height:88vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(0.32,0.72,0,1);max-width:430px;width:100%;align-self:center}
.modal.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);margin:10px auto;flex-shrink:0}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 12px;flex-shrink:0}
.modal-close{width:32px;height:32px;background:#EDEDEA;border:none;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-save{width:32px;height:32px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-save svg{width:20px;height:20px;stroke:var(--text3);fill:none;stroke-width:2;transition:all .2s}
.modal-save.saved svg{fill:#C0501F;stroke:#C0501F}
.modal-body{overflow-y:auto;padding:0;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.modal-body .card-q{padding:20px 24px 16px}
.modal-body .card-a{padding:16px 24px 40px}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .25s ease-out}
</style>
</head>
<body>
<div id="app">
  <nav id="topnav">
    <button class="tab active" onclick="switchView('today',this)">Today</button>
    <button class="tab" onclick="switchView('search',this)">Search</button>
    <button class="tab" onclick="switchView('library',this)">Library</button>
    <button class="tab" onclick="switchView('settings',this)">Settings</button>
  </nav>
  <div class="view active" id="v-today">
    <div class="today-card fade-in" id="today-card"></div>
    <div class="card-nav">
      <button class="card-nav-btn" id="btn-prev" onclick="prevCard()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="card-dots" id="card-dots"></div>
      <button class="card-nav-btn" id="btn-next" onclick="nextCard()"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
    </div>
  </div>
  <div class="view" id="v-search">
    <div class="search-wrap"><div class="search-box">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" placeholder="搜索单词、短语或中文..." autocomplete="off" autocorrect="off" autocapitalize="off">
    </div></div>
    <div class="filter-bar">
      <button class="chip active" data-filter="all" onclick="setFilter('all',this)">全部</button>
      <button class="chip" onclick="setFilter('confusable',this)">易混词</button>
      <button class="chip" onclick="setFilter('calque',this)">中式直译</button>
      <button class="chip" onclick="setFilter('register',this)">语域</button>
    </div>
    <div class="search-results" id="search-results"><div class="search-hint">输入英文单词、中文短语<br>或者你想搞懂的表达</div></div>
  </div>
  <div class="view" id="v-library">
    <div class="view-head"><h1>Library</h1></div>
    <div class="library-list" id="library-list"></div>
  </div>
  <div class="view" id="v-settings">
    <div class="view-head"><h1>Settings</h1></div>
    <div class="settings-section">
      <label>Claude API Key</label>
      <input type="password" id="api-key" placeholder="sk-ant-..." oninput="saveApiKey(this.value)">
      <p class="hint">启用 AI 智能搜索。本地词库无结果时，AI 实时分析。需配合本地代理。</p>
    </div>
    <div class="settings-section"><button onclick="clearLibrary()">清空所有收藏</button></div>
    <div class="settings-section about"><p><strong>Entry</strong> v0.1</p><p>给中文母语者的英文词感训练器</p><p style="margin-top:8px;font-size:11px">200 精选词条 · 每日学习 · 个人词库</p></div>
  </div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
      <button class="modal-save" id="modal-save" onclick="toggleSaveModal()"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<script src="db.js"></script>
<script>
const WCOLORS=['#C0501F','#2362A8','#7E35A0','#1A7340'];
// DB loaded from db.js
// ─── STATE ───
let currentView='today',dailyCards=[],dailyIndex=0,searchFilter='all';
let library=JSON.parse(localStorage.getItem('entry_lib')||'[]');
let modalEntryId=null;

// ─── HIGHLIGHT DIFF ───
function highlightWords(words){
  return words.map((w,wi)=>{
    let h='';
    for(let i=0;i<w.length;i++){
      let diff=false;
      for(let j=0;j<words.length;j++){
        if(j===wi)continue;
        if(i>=words[j].length||w[i]!==words[j][i]){diff=true;break;}
      }
      h+=diff?`<span class="df" style="color:${WCOLORS[wi%4]}">${w[i]}</span>`:w[i];
    }
    return h;
  });
}

// ─── DAILY ───
function getDailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function seededShuffle(a,s){const r=[...a];for(let i=r.length-1;i>0;i--){s=(s*1103515245+12345)&0x7fffffff;const j=s%(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;}
function loadDailyCards(){dailyCards=seededShuffle(DB,getDailySeed()).slice(0,5);dailyIndex=0;renderDailyCard();renderDots();}

// ─── RENDER ───
function renderDailyCard(){
  const card=document.getElementById('today-card'),e=dailyCards[dailyIndex];
  card.setAttribute('data-type',e.type);card.scrollTop=0;
  const saved=library.includes(e.id);
  let h=`<button class="card-save ${saved?'saved':''}" onclick="event.stopPropagation();toggleSave('${e.id}')"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></button>`;
  h+=renderEntryContent(e);
  card.innerHTML=h;
  card.classList.remove('fade-in');void card.offsetWidth;card.classList.add('fade-in');
  document.getElementById('btn-prev').classList.toggle('disabled',dailyIndex===0);
  document.getElementById('btn-next').classList.toggle('disabled',dailyIndex===dailyCards.length-1);
}

function renderEntryContent(e){
  const typeLabel={confusable:'CONFUSABLE',calque:'CALQUE',register:'REGISTER'};
  const warnSvg='<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
  const bookSvg='<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>';
  let q=`<span class="card-tag">${typeLabel[e.type]}</span>`,a='';
  if(e.type==='confusable'){
    const wl=e.words.map(w=>w.word),hl=highlightWords(wl);
    q+='<div class="word-display">'+hl.map((hw,i)=>`<span class="wd">${hw}</span>${i<hl.length-1?'<span class="wd-sep">·</span>':''}`).join('')+'</div>';
    q+=`<p class="card-brief">${e.brief}</p>`;
    e.words.forEach((w,wi)=>{
      const c=WCOLORS[wi%4];
      a+=`<div class="word-item"><h3 style="color:${c}">${w.word}</h3>`;
      a+=`<p class="word-def">${w.def}</p>`;
      if(w.note)a+=`<p class="word-note" style="color:${c}88">${w.note}</p>`;
      a+=`<ul class="word-examples">${w.examples.map(x=>`<li style="background:${c}0D;color:${c}">${x}</li>`).join('')}</ul></div>`;
    });
    if(e.trap)a+=`<div class="card-trap">${warnSvg}<p>${e.trap}</p></div>`;
  }
  if(e.type==='calque'){
    q+=`<h2 class="card-title">${e.title}</h2>`;
    q+=`<div class="calque-bad">✗ ${e.chinglish}</div>`;
    a+=`<div class="calque-good">✓ ${e.natural}</div>`;
    a+=`<div class="calque-explain">${e.explanation}</div>`;
    if(e.more&&e.more.length){
      a+='<div class="calque-more">';
      e.more.forEach(m=>{a+=`<div class="calque-more-item"><div class="zh">${m.zh}</div><div class="bad">✗ ${m.bad}</div><div class="good">✓ ${m.good}</div></div>`;});
      a+='</div>';
    }
  }
  if(e.type==='register'){
    q+=`<div style="margin:8px 0"><div class="reg-formal">${e.formal}</div><div class="reg-arrow">↓</div><div class="reg-natural">${e.natural}</div></div>`;
    a+=`<div class="reg-explain">${e.explanation}</div>`;
    a+=`<div class="reg-example bad">✗ ${e.exBad}</div>`;
    a+=`<div class="reg-example good">✓ ${e.exGood}</div>`;
    if(e.whenFormal)a+=`<div class="reg-when">${bookSvg}<p>${e.whenFormal}</p></div>`;
  }
  return `<div class="card-q">${q}</div><div class="card-a">${a}</div>`;
}

function renderDots(){document.getElementById('card-dots').innerHTML=dailyCards.map((_,i)=>`<div class="card-dot ${i===dailyIndex?'active':''}"></div>`).join('');}

// ─── NAV ───
function prevCard(){if(dailyIndex>0){dailyIndex--;renderDailyCard();renderDots();}}
function nextCard(){if(dailyIndex<dailyCards.length-1){dailyIndex++;renderDailyCard();renderDots();}}
let tx=0,ty=0;
document.getElementById('today-card').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.getElementById('today-card').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>60){dx<0?nextCard():prevCard();}},{passive:true});

// ─── VIEWS ───
function switchView(name,btn){
  if(name===currentView)return;currentView=name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  if(name==='library')renderLibrary();
  if(name==='search')document.getElementById('search-input').focus();
  if(name==='settings')document.getElementById('api-key').value=localStorage.getItem('entry_apikey')||'';
}

// ─── SAVE ───
function toggleSave(id){const i=library.indexOf(id);if(i>=0)library.splice(i,1);else library.push(id);localStorage.setItem('entry_lib',JSON.stringify(library));if(currentView==='today')renderDailyCard();if(currentView==='library')renderLibrary();}
function toggleSaveModal(){if(!modalEntryId)return;toggleSave(modalEntryId);document.getElementById('modal-save').classList.toggle('saved',library.includes(modalEntryId));}
function renderLibrary(){
  const list=document.getElementById('library-list');
  if(!library.length){list.innerHTML='<div class="empty-state"><p>还没有收藏</p><p>浏览 Today 或 Search 时点击 ♡ 收藏</p></div>';return;}
  list.innerHTML=library.map(id=>{const e=DB.find(x=>x.id===id);if(!e)return'';
    return`<div class="lib-card" onclick="openModal('${e.id}')"><div class="lib-card-body"><div class="lib-card-title">${e.title}</div><div class="lib-card-brief">${e.brief}</div></div><button class="lib-remove" onclick="event.stopPropagation();toggleSave('${e.id}')">&#x2715;</button></div>`;
  }).join('');
}

// ─── SEARCH ───
function setFilter(f,btn){searchFilter=f;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));btn.classList.add('active');doSearch();}
let st;document.getElementById('search-input').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(doSearch,200);});
function doSearch(){
  const q=document.getElementById('search-input').value.trim().toLowerCase(),box=document.getElementById('search-results');
  if(!q){box.innerHTML='<div class="search-hint">输入英文单词、中文短语<br>或者你想搞懂的表达</div>';return;}
  let r=DB.filter(e=>{
    if(searchFilter!=='all'&&e.type!==searchFilter)return false;
    const t=[e.title,e.brief,e.id];
    if(e.words)e.words.forEach(w=>t.push(w.word,w.def,w.note,...w.examples));
    if(e.chinese)t.push(e.chinese);if(e.chinglish)t.push(e.chinglish);if(e.natural)t.push(e.natural);
    if(e.explanation)t.push(e.explanation);if(e.formal)t.push(e.formal);
    if(e.exBad)t.push(e.exBad);if(e.exGood)t.push(e.exGood);
    if(e.more)e.more.forEach(m=>t.push(m.zh||'',m.bad||'',m.good||''));
    return t.some(x=>x&&x.toLowerCase().includes(q));
  });
  if(!r.length){box.innerHTML=`<div class="search-empty">没有找到 "${q}" 相关内容<br><br><span style="font-size:12px">AI 智能搜索开发中</span></div>`;return;}
  const tl={confusable:'CONFUSABLE',calque:'CALQUE',register:'REGISTER'};
  box.innerHTML=r.map(e=>`<div class="result-card" onclick="openModal('${e.id}')"><div class="result-tag">${tl[e.type]}</div><div class="result-title">${e.title}</div><div class="result-brief">${e.brief}</div></div>`).join('');
}

// ─── MODAL ───
function openModal(id){
  const e=DB.find(x=>x.id===id);if(!e)return;modalEntryId=id;
  document.getElementById('modal-body').innerHTML=renderEntryContent(e);
  document.getElementById('modal-save').classList.toggle('saved',library.includes(id));
  document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';modalEntryId=null;}

// ─── SETTINGS ───
function saveApiKey(v){localStorage.setItem('entry_apikey',v);}
function clearLibrary(){if(!confirm('确定清空所有收藏？'))return;library=[];localStorage.setItem('entry_lib','[]');renderLibrary();}

// ─── INIT ───
loadDailyCards();
</script>
